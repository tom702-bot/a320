<!doctype html><meta charset="utf-8"><title>Local voice verification</title><script src="./voice-lines.js"></script><script src="./voice-quiz-preview.js"></script><h1>Local voice verification</h1><button id="speech">Test local speech</button><button id="llm">Test local interpretation</button><pre id="result">Ready</pre><script type="module">
import * as local from './local-voice.mjs';
const result=document.querySelector('#result');
document.querySelector('#speech').onclick=async()=>{try{result.textContent='Loading speech model';await local.prepare(p=>result.textContent='Loading speech model '+p.progress+'%');const bank=await fetch('./assets/voice/manifest.json').then(r=>r.json());const cases=[['45 m / 30 m',['60 m / 30 m','45 m / 23 m','30 m / 23 m','45 m / 30 m'],3],['93,000 kg',['90 000 kg','93 000 kg','95 000 kg','80 000 kg'],1],['−1.0 psi',['1 psi','−1 psi','2 psi','−2 psi'],1],['8.6 psi',['8.6 psi','8.1 psi','9.0 psi','8.4 psi'],0]];result.textContent='';for(const [text,options,expected]of cases){const file=bank.clips[text];if(!file){result.textContent+='SKIP missing fixture '+text+'\n';continue;}const bytes=await fetch('./'+file.file).then(r=>r.arrayBuffer()),decoded=await local.decodeAudio(bytes),samples=decoded.slice(Math.round(file.start*16000),Math.round((file.start+file.duration)*16000)),transcript=await local.transcribeSamples(samples),choice=VoiceQuiz.matchAnswer(transcript,options.map(text=>({text})));result.textContent+=JSON.stringify({text,transcript,choice,expected,pass:choice===expected})+'\n';}result.textContent+='Speech test complete';}catch(e){result.textContent+='\nERROR '+e.message;}};
document.querySelector('#llm').onclick=async()=>{try{result.textContent='Loading local language model';await local.prepareAnswers(p=>result.textContent='Loading local language model '+p.progress+'%');result.textContent='';for(const [text,options,expected]of [['It is not permitted',['Always permitted','Not allowed','Only above 100 knots','Only on the ground'],1],['forty five for the runway and thirty for the taxiway',['60 m / 30 m','45 m / 23 m','30 m / 23 m','45 m / 30 m'],3],['not forty five and thirty',['60 m / 30 m','45 m / 23 m','30 m / 23 m','45 m / 30 m'],null]]){const choices=options.map(text=>({text})),raw=await local.interpret(text,choices),choice=VoiceQuiz.validateInterpretation(text,choices,raw);result.textContent+=JSON.stringify({text,raw,choice,expected,pass:choice===expected})+'\n';}result.textContent+='Interpretation test complete';}catch(e){result.textContent+='\nERROR '+e.message;}};
</script>
